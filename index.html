<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Bài Tập JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding-top: 80px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { color: #333; margin-bottom: 30px; }
        .btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            color: white;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-web2 { background-color: #007bff; }
        .btn-web2:hover { background-color: #0056b3; }
        .btn-web3 { background-color: #28a745; }
        .btn-web3:hover { background-color: #1e7e34; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Danh Sách Bài Tập JavaScript</h1>
        <a href="./Web2/" class="btn btn-web2">Xem Bài Web 2</a>
        <a href="./Web3/" class="btn btn-web3">Xem Bài Web 3 (Tính Điểm)</a>
    </div>
</body>
</html>
